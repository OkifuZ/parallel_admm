# pin = [0, 19, 380]
pin = []
g = 4.98
# density = 10.0

[solver]
admm_max_iter = 31
DCD_interval = 5
GS_max_iter = 2
contact.use_CCD = true
admm.warmstart_Ue = true
admm.warmstart_Uc = true
