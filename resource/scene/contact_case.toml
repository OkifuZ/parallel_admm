scene_name = "contact_case"
# out_file = './'
out_file = 'F:\PBA\admm_soft\admm-elasticity\result\contact_case\'
seperate_out = false
show_windows = true

[global]
dt = 0.033
pin = []
g = 2.98
# density = 10.0

[solver]
admm_max_iter = 10
DCD_interval = 5
GS_max_iter = 5
contact.use_CCD = true
admm.warmstart_Ue = true
admm.warmstart_Uc = true
contact.enable = true
contact.w_scale = 10
contact.kappa = 1e6
contact.beta = 5e5
contact.mu = 0.8
contact.unique = false
damp.kl = 1e-3
damp.km = 0

[DCD]
narrow.max_collision = 50000
narrow.thickness = 5e-2
broad.radius = 5e-2
broad.strategy = 'rebuild'


[[mesh]]
f.path = 'tetmesh/6point_wider.msh'
f.type = 'tet'
f.color = 8
t.scale = 1
t.translate = [0, 3.4, -0]
t.rotate = [0, 0, 0]
k.stretch = 5000.0
k.min_limit = 0.99
k.max_limit = 1.01
k.use_limit = true
density = 1.0

[[mesh]]
f.path = 'trimesh/2tri.obj'
f.type = 'static'
f.color = 3
t.scale = 2.0
t.translate = [0, 0.0, 0]
t.rotate = [0, 0, 0]
k.stretch = 15000.0
k.min_limit = 0.95
k.max_limit = 1.05
k.bending = 1.0
k.use_limit = false
density = 2.0
animate = ""

