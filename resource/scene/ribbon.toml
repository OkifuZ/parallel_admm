scene_name = "ribbon"
out_file = 'F:\PBA\admm_soft\admm-elasticity\result\ribbon'
seperate_out = false
show_windows = true

[global]
dt = 0.0333
pin = []
g = 0.98
density = 1.1

[solver]
admm_max_iter = 25
DCD_interval = 5
GS_max_iter = 3
contact.use_CCD = true
admm.warmstart_Ue = true
admm.warmstart_Uc = true
contact.enable = true
contact.w_scale = 1000.0
contact.kappa = 1e6
contact.beta = 2e5
contact.mu = 0.1
contact.unique = false
damp.kl = 1e-4
damp.km = 1e-3

[DCD]
narrow.max_collision = 40000
narrow.thickness = 3e-2
broad.radius = 3e-2
broad.strategy = 'rebuild'

[[mesh]]
f.path = 'frictionPD/ribbon.obj'
f.type = 'tri'
f.color = 0
t.scale = 1.6
t.translate = [0, 0.8, 0]
t.rotate = [0, 80, 90]
k.stretch = 1000.0
k.min_limit = 0.95
k.max_limit = 1.05
k.bending = 10.0
k.use_limit = true

[mesh_post]
center_ids = []


[[collider]]
type = 'plane'
center = [0, -0, 0]
halfside = 5.0
normal = [0, 1, 0]

[viewer]
scale = 10
color.background = [0.1, 0.1, 0.1]
enable_ground = false
