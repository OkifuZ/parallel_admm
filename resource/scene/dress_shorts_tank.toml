scene_name = "dress"
# out_file = './'
out_file = 'F:\PBA\admm_soft\admm-elasticity\result\10-layers-skew-mu005\'
seperate_out = true
show_windows = true

[global]
dt = 0.033
pin = [0, 1, 2, 3]
g = 2.98
# density = 10.0

[solver]
admm_max_iter = 30
DCD_interval = 10
GS_max_iter = 1
contact.use_CCD = true
admm.warmstart_Ue = true
admm.warmstart_Uc = true
contact.enable = true
contact.w_scale = 30
contact.kappa = 1e6
contact.beta = 1e5
contact.mu = 0.8
contact.unique = false
damp.kl = 1e-3
damp.km = 0

[DCD]
narrow.max_collision = 50000
narrow.thickness = 4e-2
broad.radius = 4e-2
broad.strategy = 'rebuild'

