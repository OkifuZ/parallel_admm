scene_name = "2-layers"
out_file = 'F:\PBA\admm_soft\admm-elasticity\result\2-layers'
seperate_out = false
show_windows = true

# this scene can be used to justify the meaning of chebyshev

[global]
dt = 0.0333
# pin = [0, 1, 2, 3]
pin = [0, 1, 2, 3]
g = 0.98
density = 0.1

[solver]
admm_max_iter = 25
DCD_interval = 5
GS_max_iter = 20
contact.use_CCD = true
admm.warmstart_Ue = true
admm.warmstart_Uc = true
contact.enable = true
contact.w_scale = 200.0
contact.kappa = 1e6
contact.beta = 0.1e5
contact.mu = 0.1
contact.unique = false
damp.kl = 1e-4
damp.km = 1e-1

[DCD]
narrow.max_collision = 20000
narrow.thickness = 5e-2
broad.radius = 5e-2
broad.strategy = 'rebuild'

