# Minimal XPBD cloth test: 3x3 patch, top row pinned, gravity.
# Use to isolate solver behavior (contacts disabled by default here).
scene_name = "cloth3x3"
out_file = './result/cloth3x3'
separate_out = false
show_windows = false
end_frame = 60
export_obj = true

[global]
dt = 0.02
pin = [0, 1, 2]
g = 9.8
density = 1.0

[xpbd]
enable = true
iter = 20
substeps = 1
contact_stiffness = 100.0
use_GS_contact = true

[solver]
type = 'xpbd'
admm_max_iter = 10
DCD_interval = 5
GS_max_iter = 3
contact.use_CCD = false
contact.enable = false
admm.warmstart_Ue = true
admm.warmstart_Uc = true
contact.w_scale = 2000.0
contact.kappa = 1e6
contact.beta = 0.5e5
contact.mu = 0.5
contact.unique = false

damp.kl = 1e-4
damp.km = 1e-4

[DCD]
narrow.max_collision = 100000
narrow.thickness = 1e-3
broad.radius = 1e-3
broad.strategy = 'rebuild'

[[mesh]]
f.path = 'mini/cloth3x3.obj'
f.type = 'tri'
f.color = 1
t.scale = 1
t.translate = [0, 0, 0]
t.rotate = [0, 0, 0]
k.stretch = 100.0
k.min_limit = 0.99
k.max_limit = 1.01
k.bending = 1000.0
k.use_limit = false
density = 1.0

[viewer]
scale = 1
color.background = [0.1, 0.1, 0.1]
enable_ground = false
