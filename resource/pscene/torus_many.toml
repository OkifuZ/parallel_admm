scene_name = "mydonut_999"
# out_file = 'F:\PBA\admm_soft\admm-elasticity\result\mydonut_999'
out_file = './mydonut_999_out_3.1'
separate_out = false
show_windows = true
GPU = true

[global]
dt = 0.025
pin = []
g = 3.0
density = 1.1

[solver]
admm_max_iter = 20
DCD_interval = 10
GS_max_iter = 2
Global_Jacobi_iter = 4
admm.warmstart_Ue = true
admm.warmstart_Uc = true
contact.use_CCD = true
contact.enable = true
contact.w_scale = 300.0
contact.kappa = 1e6
contact.beta = 2e5
contact.mu = 0.5
contact.unique = false
damp.kl = 1e-4
damp.km = 0

[DCD]
narrow.max_collision = 290000
narrow.thickness = 5e-2
broad.radius = 5e-2
broad.strategy = 'rebuild'

