scene_name = "fabric_2"
out_file = 'D:\data\padmm_result\fabric_2'
seperate_out = false
show_windows = true

[global]
dt = 0.01
pin = [0, 1, 2, 3]
g = 3.98

[solver]
admm_max_iter = 20
DCD_interval = 6
GS_max_iter = 20
contact.use_CCD = false
admm.warmstart_Ue = true
admm.warmstart_Uc = true
contact.enable = false
contact.use_Jacobi = true
contact.w_scale = 25
contact.kappa = 1e5
contact.beta = 1e5
contact.unique = true
contact.use_heu_wc = false
contact.mu = 0.1
damp.kl = 1e-4
damp.km = 1e-3

[DCD]
narrow.max_collision = 40000
narrow.thickness = 5e-2
broad.radius = 5e-2
broad.strategy = 'rebuild'

