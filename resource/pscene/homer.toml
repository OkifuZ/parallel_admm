scene_name = "bar_mhsl"
out_file = 'D:\data\4_8\bar_mhsl'
seperate_out = false
show_windows = true
GPU = true

[global]
dt = 0.015
#pin = [0, 3, 4, 7, 13, 14, 22, 23, 24, 33, 34, 42, 43, 44, 53, 59, 60, 71, 76, 77, 78, 83, 84, 85, 86, 90, 91, 99, 100, 101, 110, 116, 117, 133, 140, 143, 146, 147, 148, 149, 160, 161, 162, 179, 205, 228, 231, 299, 314, 315, 325, 326, 377, 494, 495, 572, 587, 599, 601, 603, 607, 628, 647, 655, 668, 669, 670, 688, 692, 714, 715, 725, 814, 817, 819, 826, 828, 829, 831, 841, 843, 875]
pin = [0, 1, 2, 3]
g = 5.5

[solver]
admm_max_iter = 25
DCD_interval = 5
GS_max_iter = 4	
Global_Jacobi_iter = 15
contact.use_CCD = false
admm.warmstart_Ue = true
admm.warmstart_Uc = true
contact.enable = true
contact.use_Jacobi = true
contact.w_scale = 50
contact.kappa = 1e5
contact.beta = 1e5
contact.unique = true
contact.use_heu_wc = false
contact.mu = 0.5
damp.kl = 2e-5
damp.km = 0

[DCD]
narrow.max_collision = 200000
narrow.thickness = 3.5e-2
broad.radius = 3.5e-2
broad.strategy = 'rebuild'

