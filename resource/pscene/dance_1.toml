show_windows = true
GPU = true

[global]
dt = 0.02
pin = []
# pin = [0, 1]
g = 4.98
# density = 10.0

[solver]
admm_max_iter = 30
DCD_interval = 5
GS_max_iter = 15
Global_Jacobi_iter = 3
contact.use_CCD = false
admm.warmstart_Ue = true
admm.warmstart_Uc = true
contact.enable = true
contact.w_scale = 15
contact.kappa = 1e6
contact.beta = 1e5
contact.mu = 0.5
contact.unique = true
damp.kl = 1e-5
damp.km = 1e-5

[DCD]
narrow.max_collision = 50000
narrow.thickness = 5e-2
broad.radius = 5e-2
broad.strategy = 'rebuild'

