scene_name = "wdamp"
# out_file = './'
out_file = 'C:\codebase\admm_elasticity\result\damping_damping_1em4'
seperate_out = true
show_windows = true

[global]
dt = 0.03
pin = [0, 1]
# pin = [0, 1]
g = 3.98
# density = 10.0

[solver]
admm_max_iter = 80
DCD_interval = 10
GS_max_iter = 2
contact.use_CCD = true
admm.warmstart_Ue = true
admm.warmstart_Uc = true
contact.enable = false
contact.w_scale = 50
contact.kappa = 1e6
contact.beta = 1e5
contact.mu = 0.1
# contact.mu = 2
contact.unique = true
damp.kl = 1e-4
# damp.kl = 0
damp.km = 0

[DCD]
narrow.max_collision = 50000
narrow.thickness = 2.5e-3
broad.radius = 2.5e-3
broad.strategy = 'rebuild'




[[mesh]]
f.path = 'frictionPD/drape_6652.obj'
